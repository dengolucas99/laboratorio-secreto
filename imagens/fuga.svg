<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Corredor que termina numa grande porta de saída trancada, com um painel de acesso ao lado">
<defs>
  <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3ef0ff" stroke-opacity=".07"/></pattern>
  <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="vinheta" cx="50%" cy="45%" r="70%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".75"/></radialGradient>
</defs>
<rect width="800" height="450" fill="#06040c"/>
<!-- perspectiva do corredor -->
<g stroke="#b28cff" stroke-opacity=".25" fill="none">
  <path d="M0 0 L250 120 M800 0 L550 120 M0 450 L250 340 M800 450 L550 340"/>
  <path d="M0 80 L250 160 M0 160 L250 200 M800 80 L550 160 M800 160 L550 200"/>
</g>
<rect x="250" y="120" width="300" height="220" fill="#0d0a18" stroke="#b28cff" stroke-opacity=".5" stroke-width="2"/>
<!-- porta -->
<rect x="300" y="150" width="200" height="190" fill="#141024" stroke="#6b55a0" stroke-width="3"/>
<path d="M400 150 V340" stroke="#6b55a0" stroke-width="3"/>
<g fill="#ffb020"><path d="M300 300 h200 v14 h-200z" opacity=".85"/></g>
<g fill="#141024"><path d="M310 300 l10 14 h10 l-10 -14z M340 300 l10 14 h10 l-10 -14z M370 300 l10 14 h10 l-10 -14z M400 300 l10 14 h10 l-10 -14z M430 300 l10 14 h10 l-10 -14z M460 300 l10 14 h10 l-10 -14z"/></g>
<!-- placa SAÍDA -->
<rect x="350" y="126" width="100" height="22" rx="3" fill="#0a2a1a" stroke="#3dffa2"/>
<text x="400" y="142" text-anchor="middle" font-family="monospace" font-size="14" fill="#3dffa2" filter="url(#brilho)">SAÍDA</text>
<!-- painel lateral -->
<g>
  <rect x="580" y="170" width="120" height="170" rx="8" fill="#110d1e" stroke="#b28cff" stroke-width="2"/>
  <rect x="598" y="186" width="84" height="26" rx="3" fill="#06040c" stroke="#6b55a0"/>
  <text x="606" y="203" font-family="monospace" font-size="10" fill="#b28cff">BATERIA ▢</text>
  <rect x="598" y="220" width="84" height="20" rx="3" fill="#06040c" stroke="#6b55a0"/>
  <text x="606" y="234" font-family="monospace" font-size="10" fill="#b28cff">CARTÃO ▭</text>
  <g fill="#1e1833" stroke="#6b55a0"><rect x="602" y="250" width="22" height="18"/><rect x="629" y="250" width="22" height="18"/><rect x="656" y="250" width="22" height="18"/><rect x="602" y="273" width="22" height="18"/><rect x="629" y="273" width="22" height="18"/><rect x="656" y="273" width="22" height="18"/><rect x="602" y="296" width="22" height="18"/><rect x="629" y="296" width="22" height="18"/><rect x="656" y="296" width="22" height="18"/></g>
  <circle cx="640" cy="326" r="5" fill="#ff3b5c" filter="url(#brilho)"/>
</g>
<!-- luzes do teto -->
<g fill="#b28cff" opacity=".7" filter="url(#brilho)"><rect x="90" y="40" width="60" height="6"/><rect x="650" y="40" width="60" height="6"/><rect x="200" y="96" width="40" height="4"/><rect x="560" y="96" width="40" height="4"/></g>
<rect width="800" height="450" fill="url(#vinheta)"/>
</svg>
