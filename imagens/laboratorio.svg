<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Laboratório com tubos de líquido verde, uma mesa com prancheta e computador, e uma cápsula rachada">
<defs>
  <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3ef0ff" stroke-opacity=".07"/></pattern>
  <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="vinheta" cx="50%" cy="45%" r="70%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <linearGradient id="liquido" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cff6b" stop-opacity=".15"/><stop offset="1" stop-color="#7cff6b" stop-opacity=".55"/></linearGradient>
</defs>
<rect width="800" height="450" fill="#03080a"/>
<rect width="800" height="450" fill="url(#grade)"/>
<rect y="350" width="800" height="100" fill="#061008"/>
<!-- tubos -->
<g>
  <rect x="50" y="60" width="70" height="250" rx="30" fill="url(#liquido)" stroke="#7cff6b" stroke-opacity=".6" stroke-width="2"/>
  <rect x="140" y="90" width="60" height="220" rx="26" fill="url(#liquido)" stroke="#7cff6b" stroke-opacity=".6" stroke-width="2"/>
  <rect x="40" y="300" width="170" height="30" rx="6" fill="#0f1f17" stroke="#2c5a3a"/>
  <g fill="#c8ffbf" opacity=".6"><circle cx="80" cy="250" r="4"/><circle cx="92" cy="190" r="3"/><circle cx="165" cy="230" r="3"/><circle cx="175" cy="160" r="2"/></g>
</g>
<!-- mesa -->
<rect x="250" y="285" width="330" height="18" fill="#12221a" stroke="#2c5a3a"/>
<path d="M270 303 V380 M560 303 V380" stroke="#2c5a3a" stroke-width="6"/>
<!-- gaveta aberta com pasta -->
<rect x="275" y="305" width="110" height="34" fill="#0c1912" stroke="#2c5a3a"/>
<rect x="290" y="296" width="80" height="16" fill="#c9a24a" stroke="#7a5f22"/>
<text x="296" y="308" font-family="monospace" font-size="9" fill="#4a1010">CONFIDENCIAL</text>
<!-- prancheta -->
<g transform="rotate(-8 360 268)">
  <rect x="325" y="240" width="70" height="44" rx="3" fill="#e9e1cf"/>
  <rect x="348" y="236" width="24" height="8" rx="2" fill="#555"/>
  <g stroke="#555" stroke-width="2"><path d="M333 255h50 M333 263h40 M333 271h46"/></g>
</g>
<!-- computador -->
<rect x="440" y="170" width="130" height="95" rx="5" fill="#04110a" stroke="#2c5a3a" stroke-width="3"/>
<path d="M495 265 v20 M470 285 h50" stroke="#2c5a3a" stroke-width="5"/>
<g font-family="monospace" font-size="11" fill="#7cff6b" filter="url(#brilho)">
  <text x="450" y="192">&gt; EXP 047</text><text x="450" y="210">&gt; STATUS:</text><text x="450" y="228" fill="#ffb020">  ACORDADO</text><text x="450" y="248">&gt; _</text>
</g>
<!-- cápsula rachada -->
<g>
  <rect x="620" y="60" width="120" height="260" rx="55" fill="#7cff6b" fill-opacity=".08" stroke="#7cff6b" stroke-opacity=".7" stroke-width="2"/>
  <path d="M655 120 L675 160 L660 190 L690 230 M675 160 L705 150" stroke="#e8fff0" stroke-width="2" fill="none"/>
  <rect x="610" y="310" width="140" height="30" rx="6" fill="#0f1f17" stroke="#2c5a3a"/>
  <circle cx="680" cy="325" r="5" fill="#ff3b5c" filter="url(#brilho)"/>
  <text x="640" y="52" font-family="monospace" font-size="11" fill="#ff3b5c">⚠ INSTÁVEL</text>
</g>
<!-- cacos no chão -->
<g fill="#7cff6b" opacity=".5"><path d="M260 400 l12 -6 l4 10z M300 420 l10 -4 l2 8z M560 410 l14 -3 l-4 9z"/></g>
<ellipse cx="320" cy="412" rx="60" ry="8" fill="#7cff6b" opacity=".12"/>
<rect width="800" height="450" fill="url(#vinheta)"/>
</svg>
